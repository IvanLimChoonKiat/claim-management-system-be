# Single-node Kafka broker in KRaft mode (no ZooKeeper).
#
# NOTE: This file was authored for portability/documentation but was NOT exercised during
# this assessment — the development machine used to build this submission does not have
# Docker installed. Kafka was instead run against a native local installation (see
# scripts/kafka-start.ps1 and README.md "Running Kafka"). If you have Docker available,
# `docker compose up -d` should bring up an equivalent single-node broker on localhost:9092;
# please report back if anything here needs adjusting — it has not been run end-to-end.
services:
  kafka:
    image: apache/kafka:4.0.0
    container_name: claims-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      CLUSTER_ID: ClaimsMgmtKRaftCluster01
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 10

volumes:
  kafka-data:
